name: Actualizar fuente

on:
  schedule:
    - cron: "30 5,17 * * *"
  workflow_dispatch:
  push:
    paths:
      - enlaces.json
      - build.mjs

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ankergames.json pendientes.md
          git diff --cached --quiet || git commit -m "Actualizar fuente"
          git push
